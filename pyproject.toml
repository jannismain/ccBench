[project]
name = "ccbench"
version = "0.1.0"
description = "A versatile evaluation suite for coding agents."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "coloredlogs>=15.0.1",
    "pathspec>=1.0.4",
    "python-dotenv>=1.2.2",
    "pyyaml",
    "tomli-w>=1.2.0",
    "typer>=0.25.1"
]

[project.scripts]
ccbench = "ccbench.cli:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["ccbench*"]

[tool.ruff]
line-length = 94
extend-exclude = ["external_references"]

[tool.pytest.ini_options]
testpaths = [
    "test/test_ccBench.py",
    "evals/*"
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.8",
    "ty>=0.0.1a32"
]

[tool.ruff.lint]
extend-ignore = ["E501"]
select = ["E", "F", "W", "C90", "B", "B9", "I"]

[tool.ty.environment]
root = ["."]

[tool.ty.src]
exclude = ["external_references/"]
