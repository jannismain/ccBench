# Compare native Claude Code with its RTK command-output optimization enabled.
env:
  ANTHROPIC_MODEL: sonnet
  CLAUDE_CODE_EFFORT_LEVEL: medium

tasks:
  - ccBench

variants:
  baseline: []
  rtk:
    - rtk

configs:
  - claude_code
  - requesty_for_claude_code

evals:
  - cloc
  - claude_code_metrics
  - pytest_pass_rate
  - static_analysis
