env:
  ANTHROPIC_MODEL: sonnet

tasks:
  - fair-share
  - c4-stop-button

variants:
  baseline:
    - claude_code
  openspec:
    - openspec:
        env:
          TOOLS: claude
  bmad_full:
    - bmad_claude_code
  bmad_quick:
    - bmad_claude_code:
        env:
          QUICK_FLOW: 1
  gsd:
    - gsd_claude_code
  speckit:
    - speckit

configs:
  - portkey_for_claude_code

evals:
  - claude_code_metrics
